<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Satisfaction Predictor</title>
  <link rel="stylesheet" href="/index.css" />
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <div class="header-content">
        <h1 class="title">📊 Customer Satisfaction Predictor</h1>
        <p class="subtitle">Enter customer details to predict satisfaction level</p>
      </div>
    </header>

    <main class="main-content">
      <form id="predict-form" class="form-container">
        <div class="form-grid">
          <div class="form-group">
            <label for="Gender">Gender</label>
            <select id="Gender" name="Gender" required>
              <option value="">-- Select --</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="Age">Age</label>
            <input id="Age" name="Age" type="number" min="1" max="120" placeholder="Enter age" required />
          </div>

          <div class="form-group">
            <label for="City">City</label>
            <input id="City" name="City" type="text" placeholder="Enter city" list="cities-list" required />
            <datalist id="cities-list">
              <option value="Chicago"></option>
              <option value="Los Angeles"></option>
              <option value="New York"></option>
              <option value="Miami"></option>
              <option value="Houston"></option>
              <option value="San Francisco"></option>
            </datalist>
          </div>

          <div class="form-group">
            <label for="Membership_Type">Membership Type</label>
            <select id="Membership_Type" name="Membership_Type" required>
              <option value="">-- Select --</option>
              <option value="Silver">Silver</option>
              <option value="Gold">Gold</option>
              <option value="Platinum">Platinum</option>
            </select>
          </div>

          <div class="form-group">
            <label for="Total_Spend">Total Spend ($)</label>
            <input id="Total_Spend" name="Total_Spend" type="number" step="0.01" min="0" placeholder="0.00" required />
          </div>

          <div class="form-group">
            <label for="Items_Purchased">Items Purchased</label>
            <input id="Items_Purchased" name="Items_Purchased" type="number" min="0" placeholder="0" required />
          </div>

          <div class="form-group">
            <label for="Average_Rating">Average Rating (0-5)</label>
            <input id="Average_Rating" name="Average_Rating" type="number" step="0.1" min="0" max="5" placeholder="0.0" required />
          </div>

          <div class="form-group">
            <label for="Days_Since_Last_Purchase">Days Since Last Purchase</label>
            <input id="Days_Since_Last_Purchase" name="Days_Since_Last_Purchase" type="number" min="0" placeholder="0" required />
          </div>
        </div>

        <div class="form-actions">
          <button id="submit-btn" type="submit" class="btn-primary">Predict Satisfaction</button>
        </div>
      </form>

      <section id="result" class="result-container" aria-live="polite" aria-atomic="true"></section>
    </main>
  </div>

  <script src="/index.js"></script>
</body>
</html>
